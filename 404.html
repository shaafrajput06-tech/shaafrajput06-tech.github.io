<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignBridge is now SignMate</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages shows this page for any address on this site that has no file. Old SignBridge links
    // (/SignBridge/...) go to the same page on the new site.
    (function () {
      var NEW_SITE = "https://signmate-pk.github.io/";
      var match = location.pathname.match(/^\/SignBridge(\/.*)?$/i);
      if (match) location.replace(NEW_SITE + (match[1] || "/").replace(/^\//, "") + location.search + location.hash);
    })();
  </script>
  <style>body{font:18px/1.5 system-ui,sans-serif;max-width:32em;margin:15vh auto;padding:0 1em;color:#1d2a3a;background:#faf6ef}</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>Looking for SignBridge? It is now called SignMate, at <a href="https://signmate-pk.github.io/">signmate-pk.github.io</a>.</p>
</body>
</html>
