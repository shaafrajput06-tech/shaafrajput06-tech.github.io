<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignBridge is now SignMate</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://signmate-pk.github.io/">
  <meta http-equiv="refresh" content="0; url=https://signmate-pk.github.io/">
  <script>
    // Keep any page, ?query and #part of the old address: /SignBridge/asl-selftest.html -> /asl-selftest.html
    (function () {
      var NEW_SITE = "https://signmate-pk.github.io/";
      var rest = location.pathname.replace(/^\/SignBridge\/?/i, "");
      location.replace(NEW_SITE + rest + location.search + location.hash);
    })();
  </script>
  <style>body{font:18px/1.5 system-ui,sans-serif;max-width:32em;margin:15vh auto;padding:0 1em;color:#1d2a3a;background:#faf6ef}</style>

  Please update your bookmark.</p>
</body>
</html>
